# Machine Server : Postgres + API + sync-agent.
# Sync LWW (updatedAt) + kick immédiat ; intervalle ~5s.

services:
  postgres:
    image: postgres:16
    container_name: shekinah_postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-schoolmatrix}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-schoolmatrix}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shekinah_pgdata_server:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${GCP_ARTIFACT_IMAGE:-northamerica-northeast1-docker.pkg.dev/shekinah-schoolmatrix/schoolmatrix-backend/backend:latest}
    container_name: shekinah_api_server
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-schoolmatrix}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-schoolmatrix}
      STORAGE_ROOT: /app/storage
      NODE_ID: LOCAL
      SYNC_KICK_URL: http://sync-agent:3911/kick
      # SYNC_API_KEY / JWT / DB_* : via env_file .env.server
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - schoolmatrix_storage_server:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  sync-agent:
    build:
      context: ../../apps/sync-agent
      dockerfile: Dockerfile
    container_name: shekinah_sync_agent
    restart: unless-stopped
    environment:
      LOCAL_API_URL: http://backend:3000
      REMOTE_API_URL: ${REMOTE_API_URL:-http://34.118.138.96}
      SYNC_API_KEY: ${SYNC_API_KEY}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-5000}
      SYNC_NODE_ID: ${SYNC_NODE_ID:-local-mother}
      SYNC_KICK_PORT: "3911"
    depends_on:
      - backend

volumes:
  shekinah_pgdata_server:
  schoolmatrix_storage_server:
